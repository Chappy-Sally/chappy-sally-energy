<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>エナジーチェック</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Hiragino Maru Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
      background: linear-gradient(180deg, #f6fbff 0%, #eef8ff 38%, #f7fff7 72%, #fff9f4 100%);
      color: #333;
      font-size: 15px;
      line-height: 1.8;
      -webkit-text-size-adjust: 100%;
    }

    .container {
      max-width: 760px;
      margin: 0 auto;
      padding: 16px;
    }

    .card {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 22px;
      padding: 18px;
      box-shadow: 0 8px 24px rgba(118, 129, 189, 0.16);
      margin-bottom: 18px;
    }

    .cover-image,
    .type-image {
      width: 100%;
      border-radius: 22px;
      display: block;
      box-shadow: 0 10px 24px rgba(120, 120, 180, 0.16);
    }

    h1, h2, h3 {
      margin-top: 0;
      color: #3f54c8;
      line-height: 1.5;
    }

    .sub {
      color: #666;
      font-size: 14px;
      line-height: 1.75;
    }

    .center {
      text-align: center;
    }

    .hidden {
      display: none;
    }

    .question-block {
      margin-bottom: 20px;
      padding: 14px;
      border-radius: 18px;
      background: #f9fbff;
      border: 1px solid #e4ecff;
    }

    .question-title {
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 12px;
      color: #3c45b7;
      line-height: 1.7;
    }

    .option-list {
      display: grid;
      gap: 10px;
    }

    label.option {
      display: block;
      background: #fff;
      border: 2px solid #d8deff;
      border-radius: 14px;
      padding: 12px 14px;
      cursor: pointer;
      transition: 0.2s;
      line-height: 1.6;
      font-size: 15px;
    }

    label.option:hover {
      border-color: #95a4ff;
      background: #f7f9ff;
    }

    input[type="radio"] {
      margin-right: 8px;
      transform: scale(1.05);
    }

    .btn {
      border: none;
      border-radius: 999px;
      padding: 14px 22px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
      display: inline-block;
      text-align: center;
      text-decoration: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #5f7bff, #7c62ff);
      color: #fff;
      box-shadow: 0 8px 18px rgba(95, 101, 255, 0.25);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      opacity: 0.96;
    }

    .btn-secondary {
      background: #fff;
      color: #4a49b8;
      border: 2px solid #cfd4ff;
    }

    .btn-wrap {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 18px;
    }

    .result-box,
    .type-box,
    .hint-box {
      background: linear-gradient(180deg, #f3f7ff, #fffdfd);
      border: 2px solid #d8ddff;
      border-radius: 18px;
      padding: 16px;
      line-height: 1.8;
      font-size: 15px;
      margin-bottom: 16px;
      color: #333;
      text-align: left;
    }

    .result-box {
      white-space: pre-line;
    }

    .result-box h3,
    .type-box h3,
    .hint-box h3 {
      margin-top: 0;
      margin-bottom: 12px;
      color: #463fcf;
      line-height: 1.5;
      font-size: 1.08em;
      font-weight: bold;
      text-align: left;
    }

    .footer-note {
      margin-top: 18px;
      font-size: 13px;
      color: #666;
      text-align: center;
      line-height: 1.75;
    }

    .alert {
      color: #c74a70;
      font-weight: bold;
      text-align: center;
      margin-top: 10px;
      line-height: 1.8;
      font-size: 14px;
    }

    .link-box {
      margin-top: 18px;
      padding: 16px;
      border-radius: 18px;
      background: #f9fbff;
      border: 1px solid #e6ecff;
      text-align: center;
      line-height: 1.75;
      color: #666;
      font-size: 13px;
    }

    .link-box .btn {
      width: auto;
      min-width: 220px;
    }

    @media (max-width: 480px) {
      body {
        font-size: 14px;
      }

      .container {
        padding: 12px;
      }

      .card {
        padding: 14px;
      }

      .question-title {
        font-size: 15px;
      }

      .sub,
      .footer-note,
      .link-box,
      .alert {
        font-size: 13px;
      }

      label.option {
        font-size: 14px;
        padding: 11px 13px;
      }

      .result-box,
      .type-box,
      .hint-box {
        font-size: 14px;
        line-height: 1.75;
      }

      .result-box h3,
      .type-box h3,
      .hint-box h3 {
        font-size: 1.03em;
      }

      .btn {
        width: 100%;
        font-size: 15px;
      }

      .link-box .btn {
        min-width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- 表紙 -->
    <section id="coverSection" class="card center">
      <img src="./images/energy_cover.png" alt="エナジーチェック表紙" class="cover-image">
      <div class="btn-wrap">
        <button class="btn btn-primary" onclick="showQuestionSection()">はじめる</button>
      </div>
    </section>

    <!-- 質問 -->
    <section id="questionSection" class="card hidden">
      <h2 class="center">エナジーチェック🐾</h2>
      <p class="sub center">5つの質問に答えてね。<br>今のあなたのエネルギー状態と、やさしい整え方をお届けするよ🌿</p>

      <div id="questionsArea"></div>
      <div id="errorMessage" class="alert hidden"></div>

      <div class="btn-wrap">
        <button class="btn btn-primary" onclick="showResult()">結果を見る</button>
      </div>
    </section>

    <!-- 結果 -->
    <section id="resultSection" class="card hidden">
      <h2 class="center">今のあなたのエネルギー状態🌈</h2>

      <div id="typeImageArea" class="hidden" style="margin-bottom:16px;"></div>
      <div id="typeBox" class="type-box"></div>
      <div id="resultBox" class="result-box"></div>
      <div id="hintBox" class="hint-box"></div>

      <div class="link-box">
        このあとも、やさしく整う時間を過ごしたいときは🌿<br>
        宇宙銀行ATMやおみくじなど、気軽に楽しめるものもあるよ🐾✨<br>
        よかったらのぞいてみてね🌈<br><br>

        <a href="https://lit.link/chappysally" target="_blank" rel="noopener noreferrer" class="btn btn-primary">
          🌈 もっと見てみる
        </a>
      </div>

      <div class="footer-note">
        今のあなたに合う整え方が、やさしく見えてきますように🌿
      </div>

      <div class="btn-wrap">
        <button class="btn btn-secondary" onclick="retryQuestions()">もう一度やる</button>
      </div>
    </section>

  </div>

  <script>
    const questions = [
      {
        id: "q1",
        title: "① 今のエネルギーにいちばん近いのは？",
        options: [
          {
            value: "light",
            label: "軽い・前向き",
            message: "今のあなたには、木々の間から光が差し込むような明るさがあります✨\n\n進みたい気持ちが自然に湧いてきていて、エネルギーも前へ向かいやすい時です。"
          },
          {
            value: "slow",
            label: "少し重たい・ゆっくりしたい",
            message: "今は森のトレイルを急がず歩くようなペースが合いそうです🌿\n\n無理に動こうとするより、風を感じるようにやさしく整えるほうが自然な流れになりそう。"
          },
          {
            value: "cloudy",
            label: "ぼんやり・はっきりしない",
            message: "今は森の中で霧が少しかかっているような状態かも☁️\n\n先が全部見えなくても大丈夫。光は少しずつ入ってきます。"
          },
          {
            value: "sensitive",
            label: "人や空気に敏感",
            message: "今のあなたは、風の通りや音の違いにも気づきやすい繊細な時期かもしれません🌙\n\n外の刺激を受けやすいからこそ、自分に戻る小さな時間が大切です。"
          },
          {
            value: "clear",
            label: "落ち着いている",
            message: "川の流れが静かに続くように、今のあなたには落ち着いたエネルギーがあります💧\n\n大きく乱れず、自分の感覚も受け取りやすい時です。"
          }
        ]
      },
      {
        id: "q2",
        title: "② 今のあなたに近いのは？",
        options: [
          {
            value: "need_rest",
            label: "少し休みたい",
            message: "今はトレイルの途中で立ち止まり、木陰でひと息つくような時間が必要そうです🌿\n\n休むことも、整う流れの一部です。"
          },
          {
            value: "need_push",
            label: "背中を押してほしい",
            message: "今のあなたには、森の先に見える光のような小さなきっかけがあると流れが動きやすそうです✨\n\n大きな一歩じゃなくて大丈夫。"
          },
          {
            value: "need_space",
            label: "ひとりの時間がほしい",
            message: "森の静かな小道をひとりで歩くような時間が、今のあなたを整えてくれそうです🌲\n\n少し距離をとることで、本来の感覚が戻ってきそう。"
          },
          {
            value: "need_flow",
            label: "流れをよくしたい",
            message: "川のせせらぎのように、今は滞りをほどいて流れをなめらかにしたい時かもしれません💧\n\n整えようとしすぎず、まずは通りをよくするイメージで。"
          },
          {
            value: "need_softness",
            label: "安心したい",
            message: "今のあなたに必要なのは、答えよりも、やさしい風が通るような安心感なのかもしれません🍃\n\nほっとできるものを増やすことが整いにつながりそうです。"
          }
        ]
      },
      {
        id: "q3",
        title: "③ いちばん近い状態は？",
        options: [
          {
            value: "moving",
            label: "進みたい",
            message: "光の差すトレイルを前へ進みたい気持ちが、ちゃんと育っています✨\n\n焦らず、自分に合う歩幅で進めば大丈夫。"
          },
          {
            value: "wobble",
            label: "揺れている",
            message: "風に葉が揺れるように、今は心が少し揺れやすいタイミングかも🌿\n\n揺れていること自体は悪いことではなく、整い直している途中なのかもしれません。"
          },
          {
            value: "stuck",
            label: "停滞している感じ",
            message: "川の流れが少しゆるやかになっているように、今は動きが弱まっているだけかもしれません💧\n\n無理に動かすより、まずは整えてみてね。"
          },
          {
            value: "open",
            label: "ひらいている感じ",
            message: "木々の間から差し込む光のように、今のあなたは受け取りやすく開いている状態です🌈\n\nいい流れを自然に受け取りやすい時だよ。"
          },
          {
            value: "deep",
            label: "深く感じている",
            message: "森の奥へ入っていくように、今は表面よりも深い感覚に触れやすい時です🌙\n\n静かな気づきが大切な鍵になりそう。"
          }
        ]
      },
      {
        id: "q4",
        title: "④ 今のあなたに必要そうなのは？",
        options: [
          {
            value: "light_word",
            label: "明るい言葉",
            message: "今のあなたには、木漏れ日のようなやさしい言葉がよくしみそうです✨\n\n強い言葉より、ほっとする言葉を選んでみてね。"
          },
          {
            value: "fresh_air",
            label: "空気を変えること",
            message: "今は風を通すように、空気を入れ替えることが整いにつながりそうです🍃\n\n窓を開けたり、少し外の空気を感じるだけでも違いそう。"
          },
          {
            value: "water",
            label: "流すこと",
            message: "川のように流していくことが今のテーマかもしれません💧\n\nためこむより、少しずつ外へ流していくイメージが合いそうです。"
          },
          {
            value: "ground",
            label: "落ち着くこと",
            message: "森の道をしっかり踏みしめるように、今は足元を整えることが大切そうです🌲\n\n安心できる土台を思い出してみてね。"
          },
          {
            value: "pause",
            label: "立ち止まること",
            message: "トレイルの途中で景色を見るように、今は少し立ち止まることで見えるものがありそうです🌿\n\n急がなくても大丈夫。"
          }
        ]
      },
      {
        id: "q5",
        title: "⑤ 今の自分にかけるなら？",
        options: [
          {
            value: "daijobu",
            label: "大丈夫",
            message: "先が全部見えなくても、道はちゃんと続いています🌿\n\n今のあなたにも『大丈夫』って言ってあげてね。"
          },
          {
            value: "slowly",
            label: "ゆっくりでいい",
            message: "トレイルはゆっくり歩くから見える景色があります🍃\n\n今は急がなくて大丈夫。"
          },
          {
            value: "trust",
            label: "その感覚を信じて",
            message: "風や光を感じるように、あなたの感覚にもちゃんと意味があります✨\n\n信じていいよ。"
          },
          {
            value: "rest",
            label: "休んでいい",
            message: "森の木陰で休むみたいに、今は立ち止まることも大切な流れです🌲\n\n休んでいいよ。"
          },
          {
            value: "flow",
            label: "流れていくよ",
            message: "川の水が少しずつ流れていくように、今のこともちゃんと動いていきます💧\n\n今は安心していて大丈夫。"
          }
        ]
      }
    ];

    const typeData = {
      hikari: {
        name: "光のタイプ✨",
        description: "今のあなたは、木々の間から差し込む光のような明るさを持っています。\n動き出す力や前向きさが自然と育ちやすい時です。",
        image: "./images/cs_hirameki.png",
        hint: "新しいことを始めるよりも、『今ある光を受け取る』意識が合いやすそう。"
      },
      kaze: {
        name: "風のタイプ🍃",
        description: "今のあなたは、風が通るように空気を変えることで整いやすいタイプです。\n重さを抱え込むより、やわらかく巡らせるのが合っています。",
        image: "./images/cs_yasashisa.png",
        hint: "窓を開ける、深呼吸する、少し外に出る。\nそんな小さな動きが流れを変えてくれそう。"
      },
      kawa: {
        name: "川のタイプ💧",
        description: "今のあなたは、川の流れのように『ためこまず流す』ことで整いやすいタイプです。\n少しずつでも巡りを戻すことが大切そう。",
        image: "./images/cs_baransu.png",
        hint: "考えすぎた時は、全部整えようとせず、まず一つだけ流してみてね。"
      },
      mori: {
        name: "森のタイプ🌲",
        description: "今のあなたは、森の静けさの中で回復しやすいタイプです。\n刺激を減らして、自分の感覚に戻る時間が鍵になりそう。",
        image: "./images/cs_naikan.png",
        hint: "ひとり時間、静かな場所、落ち着く香りなどが助けになりそう。"
      },
      trail: {
        name: "トレイルタイプ🌿",
        description: "今のあなたは、森のトレイルを歩いているような時期かもしれません。\n先が全部見えなくても、道はちゃんと続いています。",
        image: "./images/cs_koudou.png",
        hint: "答えを急がず、一歩ずつ進むことで自然と整っていきそうです。"
      }
    };

    function showQuestionSection() {
      document.getElementById("coverSection").classList.add("hidden");
      document.getElementById("resultSection").classList.add("hidden");
      document.getElementById("questionSection").classList.remove("hidden");
      renderQuestions();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function renderQuestions() {
      const area = document.getElementById("questionsArea");
      area.innerHTML = "";

      questions.forEach((q) => {
        const block = document.createElement("div");
        block.className = "question-block";

        let optionsHtml = "";
        q.options.forEach((opt) => {
          optionsHtml += `
            <label class="option">
              <input type="radio" name="${q.id}" value="${opt.value}">
              ${opt.label}
            </label>
          `;
        });

        block.innerHTML = `
          <div class="question-title">${q.title}</div>
          <div class="option-list">${optionsHtml}</div>
        `;

        area.appendChild(block);
      });
    }

    function getSelectedOption(question) {
      const checked = document.querySelector(\`input[name="\${question.id}"]:checked\`);
      if (!checked) return null;
      return question.options.find(opt => opt.value === checked.value);
    }

    function getTypeKey(selectedValues) {
      const score = {
        hikari: 0,
        kaze: 0,
        kawa: 0,
        mori: 0,
        trail: 0
      };

      selectedValues.forEach(value => {
        if (["light", "moving", "open", "light_word", "trust"].includes(value)) score.hikari += 2;
        if (["sensitive", "need_softness", "wobble", "fresh_air", "slowly"].includes(value)) score.kaze += 2;
        if (["clear", "need_flow", "stuck", "water", "flow"].includes(value)) score.kawa += 2;
        if (["slow", "need_rest", "deep", "ground", "rest"].includes(value)) score.mori += 2;
        if (["cloudy", "need_push", "moving", "pause", "daijobu"].includes(value)) score.trail += 2;
      });

      return Object.keys(score).reduce((a, b) => score[a] >= score[b] ? a : b);
    }

    function buildSummary(selectedValues) {
      if (selectedValues.includes("need_rest") || selectedValues.includes("rest") || selectedValues.includes("slow")) {
        return "今のあなたは、森のトレイルの途中で少し立ち止まり、木陰で休みながら風を感じる時間が必要なタイミングかも🌿\n\nがんばることよりも、まず安心してゆるむことが整いにつながりそうです。\n\n木々の間から差し込む光のように、『休んでいい』というサインを受け取ってみてね。";
      }

      if (selectedValues.includes("cloudy") || selectedValues.includes("wobble") || selectedValues.includes("pause")) {
        return "今のあなたは、森のトレイルを歩いているような状態かもしれません🌲\n\n先が全部見えなくても大丈夫。道はちゃんと続いていて、必要な光は少しずつ差し込んできます。\n\n風や景色を感じながら、自分のペースで進めば大丈夫だよ。";
      }

      if (selectedValues.includes("moving") || selectedValues.includes("light") || selectedValues.includes("open")) {
        return "今のあなたには、光の差す道を進む力がちゃんとあります✨\n\n焦らず、自分に合う歩幅で進むことで、やさしい流れが自然とひらいていきそうです。\n\n風を感じながら、一歩ずつ進んでいけば大丈夫。";
      }

      if (selectedValues.includes("need_softness") || selectedValues.includes("daijobu") || selectedValues.includes("fresh_air")) {
        return "今のあなたにいちばん必要なのは、答えよりも、ほっとできる安心感なのかもしれません🍃\n\n森の中に風がやさしく通るように、心がゆるむ時間を少しずつ増やしていくことで整っていきそうです。";
      }

      return "今のあなたは、森と光と川の流れの中にいるような時かもしれません🌈\n\n無理に変えようとしなくても、風を感じながら、自分の感覚を受け取ることで自然と整っていきそうです。\n\n今のあなたにも、ちゃんと流れがあります。";
    }

    function showResult() {
      const errorBox = document.getElementById("errorMessage");
      errorBox.classList.add("hidden");
      errorBox.textContent = "";

      const selectedOptions = [];

      for (const q of questions) {
        const selected = getSelectedOption(q);
        if (!selected) {
          errorBox.textContent = "すべての質問に答えてね🐾";
          errorBox.classList.remove("hidden");
          return;
        }
        selectedOptions.push(selected);
      }

      const selectedValues = selectedOptions.map(opt => opt.value);
      const typeKey = getTypeKey(selectedValues);
      const typeInfo = typeData[typeKey];

      document.getElementById("typeImageArea").innerHTML =
        \`<img src="\${typeInfo.image}" alt="\${typeInfo.name}" class="type-image">\`;
      document.getElementById("typeImageArea").classList.remove("hidden");

      const typeHtml = `
        <h3>今のあなたのエネルギータイプ</h3>
        <strong>${typeInfo.name}</strong><br>
        ${typeInfo.description.replace(/\n/g, "<br>")}
      `;

      const resultMessages = selectedOptions.map(opt => opt.message).join("\n\n");
      const summary = buildSummary(selectedValues);

      const resultHtml = `
        <h3>今のあなたに届いたメッセージ🌿</h3>
        ${resultMessages.replace(/\n/g, "<br>")}
        <br><br>
        <h3>まとめメッセージ</h3>
        ${summary.replace(/\n/g, "<br>")}
      `;

      const hintHtml = `
        <h3>やさしい整え方のヒント✨</h3>
        ${typeInfo.hint.replace(/\n/g, "<br>")}
      `;

      document.getElementById("typeBox").innerHTML = typeHtml;
      document.getElementById("resultBox").innerHTML = resultHtml;
      document.getElementById("hintBox").innerHTML = hintHtml;

      document.getElementById("questionSection").classList.add("hidden");
      document.getElementById("resultSection").classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function retryQuestions() {
      document.getElementById("resultSection").classList.add("hidden");
      document.getElementById("questionSection").classList.remove("hidden");

      const radios = document.querySelectorAll('input[type="radio"]');
      radios.forEach(radio => {
        radio.checked = false;
      });

      document.getElementById("errorMessage").classList.add("hidden");
      document.getElementById("errorMessage").textContent = "";

      window.scrollTo({ top: 0, behavior: "smooth" });
    }
  </script>
</body>
</html>
